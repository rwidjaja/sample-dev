unique_name: dim_time_dataset
object_type: dataset
label: dim_time_dataset
columns:
  - name: name
    data_type: string
  - name: pk_date
    data_type: datetime
  - name: datekey
    data_type: int
  - name: date_name
    data_type: string
  - name: year
    data_type: string
  - name: year_name
    data_type: string
  - name: half_year
    data_type: date
  - name: half_year_name
    data_type: string
  - name: quarter
    data_type: date
  - name: quarter_name
    data_type: string
  - name: month
    data_type: date
  - name: month_name
    data_type: string
  - name: week
    data_type: date
  - name: week_name
    data_type: string
  - name: day_of_year
    data_type: int
  - name: day_of_year_name
    data_type: string
  - name: day_of_week
    data_type: int
  - name: day_of_week_name
    data_type: string
  - name: week_of_year
    data_type: int
  - name: week_of_year_name
    data_type: string
  - name: month_of_year
    data_type: int
  - name: month_of_year_name
    data_type: string
  - name: quarter_of_year
    data_type: int
  - name: quarter_of_year_name
    data_type: string
connection_id: con_atscale_data_SalesInsights
sql: |-
  SELECT date_day, date_day::timestamp as pk_date,
                cast(to_char(date_day, 'YYYYMMDD') as decimal) as datekey,
                to_char(date_day, 'FMDay, FMMonth DD, YYYY') as date_name,
                CAST(EXTRACT(YEAR from date_day) as VARCHAR) as year,
                concat('Calendar ', to_char(date_day, 'YYYY')) as year_name,
                case when EXTRACT(QUARTER FROM date_day) < 3 then DATE_TRUNC('year', date_day) else DATE_TRUNC('year', date_day) + interval '6 months' end::DATE as half_year,
                case when EXTRACT(QUARTER FROM date_day) < 3 then concat('Semester 1, ', to_char(date_day, 'YYYY')) else concat('Semester 2, ', to_char(date_day, 'YYYY')) end as half_year_name,
                DATE_TRUNC('quarter', date_day)::DATE as quarter,
                concat('Quarter ', EXTRACT(QUARTER from date_day), ', ', EXTRACT(YEAR from date_day)) as quarter_name,
                DATE_TRUNC('month', date_day)::DATE as month,
                to_char(date_day, 'FMMonth YYYY') as month_name,
                DATE_TRUNC('week', date_day)::DATE as week,
                concat('Week ', EXTRACT(WEEK from date_day), to_char(date_day, ', YYYY')) as week_name,
                DATE_PART('doy', date_day) as day_of_year,
                concat('Day ', DATE_PART('doy', date_day)) as day_of_year_name,
                DATE_PART('dow', date_day) as day_of_week,
                to_char(date_day, 'FMDay') as day_of_week_name,
                EXTRACT(WEEK from date_day) as week_of_year,
                concat('Week ', EXTRACT(WEEK from date_day)) as week_of_year_name,
                EXTRACT(MONTH from date_day) as month_of_year,
                to_char(date_day, 'FMMonth') as month_of_year_name,
                EXTRACT(QUARTER from date_day) as quarter_of_year,
                concat('Quarter ', EXTRACT(QUARTER from date_day)) as quarter_of_year_name
                FROM (select date_day::date from generate_series('2005-07-01', '2026-12-31', '1 day'::interval) date_day)
